components:
  schemas:
    CategoryEnum:
      enum:
      - losts
      - adoptions
      - found
      type: string
      description: |-
        * `losts` - losts
        * `adoptions` - adoptions
        * `found` - found
    Flyer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        mode:
          $ref: '#/components/schemas/ModeEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/FlyerStatusEnum'
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        pet:
          allOf:
          - $ref: '#/components/schemas/Pet'
          readOnly: true
        creator:
          type: string
          format: uuid
          readOnly: true
        creator_display_name:
          type: string
          readOnly: true
        creator_avatar_url:
          type: string
          readOnly: true
        last_seen_location:
          type: string
          maxLength: 255
        last_seen_date:
          type: string
          format: date-time
          nullable: true
        location_lat:
          type: number
          format: double
          nullable: true
        location_lng:
          type: number
          format: double
          nullable: true
        distinctive_markings:
          type: string
        contact_phone:
          type: string
          maxLength: 32
        contact_email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        qr_target_type:
          type: string
          maxLength: 32
        qr_target_value:
          oneOf:
          - type: string
            format: uri
            maxLength: 512
          - type: string
            maxLength: 0
        photo_url:
          type: string
          readOnly: true
        photo_urls:
          type: array
          items:
            type: string
          description: Signed URL of the pet's single photo (pet.photos is prefetched).
          readOnly: true
        export_png_url:
          type: string
          readOnly: true
        export_pdf_url:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - creator
      - creator_avatar_url
      - creator_display_name
      - deleted_at
      - export_pdf_url
      - export_png_url
      - id
      - pet
      - photo_url
      - photo_urls
      - status
      - updated_at
    FlyerStatusEnum:
      enum:
      - draft
      - generating
      - active
      - resolved
      type: string
      description: |-
        * `draft` - Draft
        * `generating` - Generating assets
        * `active` - Active
        * `resolved` - Resolved
    GoogleCallback:
      type: object
      properties:
        code:
          type: string
        redirect_uri:
          type: string
      required:
      - code
      - redirect_uri
    GoogleUrl:
      type: object
      properties:
        redirect_uri:
          type: string
      required:
      - redirect_uri
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - email
      - password
    ModeEnum:
      enum:
      - emergency
      - found
      - outreach
      type: string
      description: |-
        * `emergency` - Emergency (lost pet)
        * `found` - Found pet
        * `outreach` - Outreach (adoption)
    PaginatedFlyerList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Flyer'
    PatchedProfileUpdate:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 32
    Pet:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        species:
          $ref: '#/components/schemas/SpeciesEnum'
        breed:
          type: string
          maxLength: 120
        color:
          type: string
          maxLength: 120
        age:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        temperament_tags: {}
        health_tags: {}
        photo_path:
          type: string
          maxLength: 512
        photo_url:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusF90Enum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - photo_url
    PetCreate:
      type: object
      properties:
        name:
          type: string
          default: ''
          maxLength: 120
        species:
          allOf:
          - $ref: '#/components/schemas/SpeciesEnum'
          default: dog
        breed:
          type: string
          maxLength: 120
        color:
          type: string
          maxLength: 120
        age:
          type: integer
          maximum: 50
          minimum: 0
          nullable: true
        temperament_tags:
          type: array
          items:
            type: string
            maxLength: 40
          maxItems: 12
        health_tags:
          type: array
          items:
            type: string
            maxLength: 40
          maxItems: 12
        photo_path:
          type: string
          maxLength: 512
        photo_paths:
          type: array
          items:
            type: string
            maxLength: 512
          maxItems: 1
        status:
          allOf:
          - $ref: '#/components/schemas/StatusF90Enum'
          default: adoptable
    PhotoUploadRequest:
      type: object
      properties:
        photo:
          type: string
          format: uri
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          default: losts
      required:
      - photo
    PhotoUploadResponse:
      type: object
      properties:
        key:
          type: string
        url:
          type: string
        thumb_key:
          type: string
        thumb_url:
          type: string
        pet_classes:
          type: array
          items:
            type: string
        detected_classes:
          type: array
          items:
            type: string
        max_confidence:
          type: number
          format: double
        breed:
          type: string
        breed_confidence:
          type: number
          format: double
        color:
          type: string
        color_confidence:
          type: number
          format: double
      required:
      - breed
      - breed_confidence
      - color
      - color_confidence
      - detected_classes
      - key
      - max_confidence
      - pet_classes
      - thumb_key
      - thumb_url
      - url
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          maxLength: 128
          minLength: 8
        display_name:
          type: string
          maxLength: 120
      required:
      - email
      - password
    SpeciesEnum:
      enum:
      - dog
      - cat
      - bird
      - horse
      - other
      type: string
      description: |-
        * `dog` - Dog
        * `cat` - Cat
        * `bird` - Bird
        * `horse` - Horse
        * `other` - Other
    StatusF90Enum:
      enum:
      - lost
      - found
      - adoptable
      - reunited
      - adopted
      type: string
      description: |-
        * `lost` - Lost
        * `found` - Found
        * `adoptable` - Adoptable
        * `reunited` - Reunited
        * `adopted` - Adopted
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        display_name:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 32
        avatar_path:
          type: string
          maxLength: 512
        avatar_url:
          type: string
          description: Fresh signed URL for the private avatar object ("" when none
            / on failure).
          readOnly: true
        google_id:
          type: string
          readOnly: true
          nullable: true
        email_verified:
          type: boolean
          readOnly: true
      required:
      - avatar_url
      - email
      - email_verified
      - google_id
      - id
