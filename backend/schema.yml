components:
  schemas:
    Flyer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        mode:
          $ref: '#/components/schemas/ModeEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/FlyerStatusEnum'
          readOnly: true
        pet:
          allOf:
          - $ref: '#/components/schemas/Pet'
          readOnly: true
        creator:
          type: string
          format: uuid
          readOnly: true
        creator_display_name:
          type: string
          readOnly: true
        last_seen_location:
          type: string
          maxLength: 255
        last_seen_date:
          type: string
          format: date-time
          nullable: true
        location_lat:
          type: number
          format: double
          nullable: true
        location_lng:
          type: number
          format: double
          nullable: true
        distinctive_markings:
          type: string
        contact_phone:
          type: string
          maxLength: 32
        contact_email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        reward_enabled:
          type: boolean
        reward_amount_cents:
          type: integer
          maximum: 2147483647
          minimum: 0
        reward_currency:
          type: string
          maxLength: 8
        qr_target_type:
          type: string
          maxLength: 32
        qr_target_value:
          oneOf:
          - type: string
            format: uri
            maxLength: 512
          - type: string
            maxLength: 0
        photo_url:
          type: string
          readOnly: true
        export_png_url:
          type: string
          readOnly: true
        export_pdf_url:
          type: string
          readOnly: true
        match:
          allOf:
          - $ref: '#/components/schemas/FlyerMatch'
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - creator
      - creator_display_name
      - export_pdf_url
      - export_png_url
      - id
      - match
      - pet
      - photo_url
      - status
      - updated_at
    FlyerMatch:
      type: object
      description: Vision-match counterpart of a flyer pin (lost <-> found).
      properties:
        flyer_id:
          type: string
          format: uuid
        mode:
          type: string
        pet_name:
          type: string
        score:
          type: number
          format: double
      required:
      - flyer_id
      - mode
      - pet_name
      - score
    FlyerStatusEnum:
      enum:
      - draft
      - generating
      - active
      - resolved
      type: string
      description: |-
        * `draft` - Draft
        * `generating` - Generating assets
        * `active` - Active
        * `resolved` - Resolved
    GoogleCallback:
      type: object
      properties:
        code:
          type: string
        redirect_uri:
          type: string
      required:
      - code
      - redirect_uri
    GoogleUrl:
      type: object
      properties:
        redirect_uri:
          type: string
      required:
      - redirect_uri
    KindEnum:
      enum:
      - match_found
      - match_lost
      - system
      type: string
      description: |-
        * `match_found` - Possible match for your lost pet
        * `match_lost` - Your found pet may be someone's lost pet
        * `system` - System
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - email
      - password
    ModeEnum:
      enum:
      - emergency
      - found
      - outreach
      type: string
      description: |-
        * `emergency` - Emergency (lost pet)
        * `found` - Found pet
        * `outreach` - Outreach (adoption)
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        link:
          type: string
          readOnly: true
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
