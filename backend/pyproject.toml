[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pawprint-backend"
version = "0.1.0"
description = "PawPrint backend — Django 5.2+ DRF API (lost-pet alerts + adoption flyers)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "celery>=5.4",
    "channels>=4.1",
    "channels-redis>=4.2",
    "django-allauth[socialaccount]>=65.0",
    "django-cors-headers>=4.6",
    "cloudinary>=1.41",
    "python-dotenv>=1.0",
    "Pillow>=11.0",
    "qrcode[pil]>=8.0",
    "stripe>=11.0",
    "httpx>=0.28",
    "ultralytics>=8.3",
    "weasyprint>=63.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-xdist>=3.6",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "responses>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "django-stubs>=5.1",
    "djangorestframework-stubs>=3.15",
    "types-Pillow",
    "types-requests",
]

# Explicit package discovery so `uv pip install .` / `pip install .` succeeds on a full
# checkout (flat-layout auto-discovery otherwise aborts on apps/ + config/ + templates/).
[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
addopts = "-n auto --cov=apps --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = false
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

# --- CPU-only PyTorch source overrides to bypass massive CUDA GPU downloads ---
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
