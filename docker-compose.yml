# PawPrint dev stack — `docker compose up` starts everything:
#   postgres · redis          internal-only (no host ports — the dev machine already runs
#                             its own postgres :5433 / redis :6379 / mailpit :1025/:8025 as
#                             host services, so publishing those would conflict)
#   web      Django API + migrations   http://localhost:8000
#   celery   worker on flyers,webhooks,images,default queues
#   frontend Vite dev server          http://localhost:5173  (proxies /api,/media,/ws to web)
#
# Dev email goes to the HOST mailpit (host.docker.internal:1025 — same mailpit the host-only
# setup uses). On a machine without a host mailpit: `docker compose --profile mailpit up`
# with COMPOSE_EMAIL_HOST=mailpit for a fully self-contained stack.
#
# Secrets come from the root .env (env_file); the `environment:` blocks below
# override host-local addresses with in-network service names.
name: pawprint

services:
  postgres:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional self-contained mailpit — only with: docker compose --profile mailpit up
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mailpit"]
    ports:
      - "1025:1025" # dev SMTP
      - "8025:8025" # web UI

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      EMAIL_HOST: ${COMPOSE_EMAIL_HOST:-host.docker.internal}
      EMAIL_PORT: "1025"
      # Weights are baked into the image at /opt/weights by direct download —
      # never via Hugging Face — and the ./backend bind mount does not touch /opt.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      YOLO_MODEL_PATH: /opt/weights/yolov8s-worldv2.pt
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_DEBUG: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000

  celery:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      EMAIL_HOST: ${COMPOSE_EMAIL_HOST:-host.docker.internal}
      EMAIL_PORT: "1025"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      YOLO_MODEL_PATH: /opt/weights/yolov8s-worldv2.pt
      DJANGO_ALLOWED_HOSTS: "*"
      PAWPRINT_MIGRATE: "0" # web migrates; celery must not race it on a fresh DB
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    command: celery -A config worker -Q flyers,webhooks,images,default -l info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # Server-side Vite proxy target: the web service inside the compose network.
      PAWPRINT_API_URL: http://web:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      web:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  frontend-node-modules:
